    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-database.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAHWbdadwqqEkHa9yMqBLWhWv4xcwTbBLs",
            authDomain: "luzuno-cc9bb.firebaseapp.com",
            projectId: "luzuno-cc9bb",
            storageBucket: "luzuno-cc9bb.firebasestorage.app",
            messagingSenderId: "207252700714",
            appId: "1:207252700714:web:a334ed22ca156208524d53"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Post comment function
        function postComment() {
            let name = document.getElementById("username").value.trim();
            let comment = document.getElementById("comment").value.trim();

            if (name === "" || comment === "") {
                alert("Nama dan komentar tidak boleh kosong!");
                return;
            }

            // Push data to Firebase
            const commentsRef = ref(database, 'comments');
            const newCommentRef = push(commentsRef);
            set(newCommentRef, {
                name: name,
                comment: comment,
                timestamp: new Date().toLocaleString()
            });

            // Clear input fields
            document.getElementById("username").value = "";
            document.getElementById("comment").value = "";
        }

        // Load comments function
        function loadComments() {
            const commentsRef = ref(database, 'comments');
            onValue(commentsRef, (snapshot) => {
                const commentsContainer = document.getElementById("commentsContainer");
                commentsContainer.innerHTML = ""; // Clear existing comments

                snapshot.forEach((childSnapshot) => {
                    const commentData = childSnapshot.val();
                    const commentDiv = document.createElement("div");
                    commentDiv.classList.add("comment-box");

                    commentDiv.innerHTML = `
                        <strong>${commentData.name}</strong> - <small>${commentData.timestamp}</small>
                        <p>${commentData.comment}</p>
                        <hr>
                    `;
                    commentsContainer.appendChild(commentDiv);
                });
            });
        }

        // Load comments on page load
        document.addEventListener("DOMContentLoaded", function() {
            loadComments();
        });
    </script>
