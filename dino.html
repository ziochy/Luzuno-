<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Game</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        #warning {
            display: none;
            color: red;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        canvas {
            background-color: #fff;
            border: 2px solid black;
        }
        .controls {
            margin-top: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="warning">⚠️ Putar layar ke mode landscape untuk pengalaman terbaik!</div>
    <canvas id="gameCanvas" width="700" height="250"></canvas>
    <div class="controls">
        <button id="startButton">Mulai</button>
        <button id="jumpButton">Lompat</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const warning = document.getElementById('warning');

        function checkOrientation() {
            warning.style.display = window.innerWidth < 600 ? 'block' : 'none';
        }
        window.addEventListener('resize', checkOrientation);
        checkOrientation();

        const dinoImg = new Image();
        dinoImg.src = 'dino.png';

        const carImages = [
            { src: 'mobil.png', chance: 15, heal: false },
            { src: 'mobil1.png', chance: 15, heal: false },
            { src: 'mobil2.png', chance: 15, heal: false },
            { src: 'mobil3.png', chance: 15, heal: false },
            { src: 'mobil4.png', chance: 15, heal: false },
            { src: 'mobil5.gif', chance: 15, heal: false },
            { src: 'mobil6.png', chance: 10, heal: true }
        ];

        const bgImg = new Image();
        bgImg.src = 'background.png';

        let gameRunning = false;
        let speedMultiplier = 1;
        let score = 0;
        let lives = 3;
        let invincibleTime = 0;

        let dino = {
            x: 50,
            y: 150,
            width: 60,
            height: 60,
            velocityY: 0,
            gravity: 0.6,
            jumpPower: -10,
            isJumping: false,
            groundY: 150,
        };

        let obstacles = [];

        function getRandomCar() {
            let randomNum = Math.random() * 100;
            let sum = 0;
            for (let car of carImages) {
                sum += car.chance;
                if (randomNum <= sum) {
                    return car;
                }
            }
            return carImages[0];
        }

        function spawnObstacle() {
            let lastX = obstacles.length > 0 ? obstacles[obstacles.length - 1].x : canvas.width;
            let car = getRandomCar();

            let newObstacle = {
                x: lastX + Math.random() * 300 + 200,
                y: dino.groundY + 30,
                width: 50,
                height: 30,
                speed: 5,
                image: new Image(),
                heal: car.heal
            };
            newObstacle.image.src = car.src;

            obstacles.push(newObstacle);
        }

        document.getElementById('startButton').addEventListener('click', startGame);
        document.getElementById('jumpButton').addEventListener('click', jump);
        document.addEventListener('keydown', (event) => { if (event.code === 'Space') jump(); });

        function jump() {
            if (!gameRunning) return;
            if (!dino.isJumping) {
                dino.isJumping = true;
                dino.velocityY = dino.jumpPower;
            }
        }

        function startGame() {
            if (!gameRunning) {
                gameRunning = true;
                dino.y = dino.groundY;
                dino.velocityY = 0;
                obstacles = [];
                score = 0;
                lives = 3;
                speedMultiplier = 1;
                invincibleTime = 0;

                for (let i = 0; i < 3; i++) {
                    spawnObstacle();
                }

                requestAnimationFrame(updateGame);
            }
        }

        function updateGame() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            moveDino();
            moveObstacles();
            checkCollision();
            drawDino();
            drawObstacles();
            drawScore();
            drawLives();

            invincibleTime--;
            requestAnimationFrame(updateGame);
        }

        function drawDino() {
            ctx.drawImage(dinoImg, dino.x, dino.y, dino.width, dino.height);
        }

        function moveDino() {
            dino.y += dino.velocityY;
            dino.velocityY += dino.gravity;

            if (dino.y > dino.groundY) {
                dino.y = dino.groundY;
                dino.isJumping = false;
                dino.velocityY = 0;
            }
        }

        function drawObstacles() {
            obstacles.forEach(obstacle => {
                ctx.drawImage(obstacle.image, obstacle.x, obstacle.y, obstacle.width, obstacle.height);
            });
        }

        function moveObstacles() {
            for (let obstacle of obstacles) {
                obstacle.x -= obstacle.speed * speedMultiplier;
            }

            if (obstacles.length > 0 && obstacles[0].x < -obstacles[0].width) {
                obstacles.shift();
                spawnObstacle();
            }
        }

        function checkCollision() {
            if (invincibleTime > 0) return;

            for (let obstacle of obstacles) {
                if (dino.x < obstacle.x + obstacle.width &&
                    dino.x + dino.width > obstacle.x &&
                    dino.y < obstacle.y + obstacle.height &&
                    dino.y + dino.height > obstacle.y) {
                    
                    if (obstacle.heal) {
                        lives++;
                    } else {
                        lives--;
                        invincibleTime = 60;
                    }

                    if (lives <= 0) {
                        gameRunning = false;
                        alert('Game Over! Skor Anda: ' + score);
                    }
                    return;
                }
            }
        }

        function drawScore() {
            ctx.fillStyle = "black";
            ctx.font = "20px Arial";
            ctx.fillText("Score: " + score, 20, 30);
        }

        function drawLives() {
            ctx.fillStyle = "red";
            ctx.font = "20px Arial";
            ctx.fillText("Lives: " + lives, 600, 30);
        }
    </script>
</body>
</html>
