<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Game</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        canvas {
            background-color: #fff;
            border: 2px solid black;
        }
        .controls {
            margin-top: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="200"></canvas>
    <div class="controls">
        <button id="startButton">Mulai</button>
        <button id="jumpButton">Loncat</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Load Images
        const dinoImg = new Image();
        dinoImg.src = 'dino.png';

        const cactusImg = new Image();
        cactusImg.src = 'kaktus.png';

        const bgImg = new Image();
        bgImg.src = 'background.png';

        let gameRunning = false;

        // Dino
        let dino = { x: 50, y: 150, width: 40, height: 40, velocityY: 0, gravity: 0.8, jumpPower: -12, isJumping: false };

        // Kaktus
        let cactus = { x: canvas.width, y: 160, width: 30, height: 40, speed: 3 };

        // Event Listener untuk tombol
        document.getElementById('startButton').addEventListener('click', startGame);
        document.getElementById('jumpButton').addEventListener('click', jump);
        document.addEventListener('keydown', (event) => { if (event.code === 'Space') jump(); });

        function jump() {
            if (!gameRunning) return;
            if (!dino.isJumping) {
                dino.isJumping = true;
                dino.velocityY = dino.jumpPower;
            }
        }

        function startGame() {
            if (!gameRunning) {
                gameRunning = true;
                dino.y = 150;
                dino.velocityY = 0;
                cactus.x = canvas.width;
                updateGame();
            }
        }

        function updateGame() {
            if (!gameRunning) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height); // Gambar background
            moveDino();
            moveCactus();
            checkCollision();
            drawDino();
            drawCactus();
            requestAnimationFrame(updateGame);
        }

        function drawDino() {
            ctx.drawImage(dinoImg, dino.x, dino.y, dino.width, dino.height);
        }

        function moveDino() {
            dino.y += dino.velocityY;
            dino.velocityY += dino.gravity;

            if (dino.y > 150) { 
                dino.y = 150;
                dino.isJumping = false;
            }
        }

        function drawCactus() {
            ctx.drawImage(cactusImg, cactus.x, cactus.y, cactus.width, cactus.height);
        }

        function moveCactus() {
            cactus.x -= cactus.speed;
            if (cactus.x < -cactus.width) {
                cactus.x = canvas.width + Math.random() * 200; // Kaktus muncul lagi secara acak
            }
        }

        function checkCollision() {
            if (dino.x < cactus.x + cactus.width &&
                dino.x + dino.width > cactus.x &&
                dino.y + dino.height > cactus.y) {
                alert('Game Over!');
                gameRunning = false;
            }
        }
    </script>
</body>
</html>
