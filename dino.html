<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Game</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        canvas {
            background-color: #fff;
            border: 2px solid black;
        }
        .controls {
            margin-top: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="700" height="250"></canvas>
    <div class="controls">
        <button id="startButton">Mulai</button>
        <button id="jumpButton">Lompat</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const dinoImg = new Image();
        dinoImg.src = 'dino.png';

        const carImages = [
            { src: 'mobil.png', chance: 15 },
            { src: 'mobil1.png', chance: 15 },
            { src: 'mobil2.png', chance: 15 },
            { src: 'mobil3.png', chance: 15 },
            { src: 'mobil4.png', chance: 15 },
            { src: 'mobil5.gif', chance: 15 },
            { src: 'mobil6.png', chance: 10 }
        ];

        const bgImg = new Image();
        bgImg.src = 'background.png';

        const heartImg = new Image();
        heartImg.src = 'heart.png';

        let gameRunning = false;
        let speedMultiplier = 1;
        let speedIncreaseInterval;
        let score = 0;
        let lives = 3;
        let invincible = false;

        let dino = {
            x: 50, 
            y: 150,  
            width: 60, 
            height: 60, 
            velocityY: 0, 
            gravity: 0.6,  
            jumpPower: -10,  
            isJumping: false,
            groundY: 150,  
        };

        let obstacles = [];

        // Fungsi untuk memilih mobil secara acak berdasarkan peluang
        function chooseCarImage() {
            let random = Math.random() * 100;
            let cumulativeChance = 0;

            for (let car of carImages) {
                cumulativeChance += car.chance;
                if (random <= cumulativeChance) {
                    let img = new Image();
                    img.src = car.src;
                    return { img, src: car.src };
                }
            }
            return { img: new Image(), src: 'mobil.png' }; 
        }

        // Fungsi untuk spawn mobil baru
        function spawnObstacle() {
            let lastX = obstacles.length > 0 ? obstacles[obstacles.length - 1].x : canvas.width;
            let car = chooseCarImage();
            
            let newObstacle = {
                x: lastX + Math.random() * 300 + 200, 
                y: dino.groundY + 30,  
                width: 50,  
                height: 30,  
                speed: 5,
                img: car.img,
                src: car.src
            };
            obstacles.push(newObstacle);
        }

        document.getElementById('startButton').addEventListener('click', startGame);
        document.getElementById('jumpButton').addEventListener('click', jump);
        document.addEventListener('keydown', (event) => { if (event.code === 'Space') jump(); });

        function jump() {
            if (!gameRunning) return;
            if (!dino.isJumping) {
                dino.isJumping = true;
                dino.velocityY = dino.jumpPower;
            }
        }

        function startGame() {
            if (!gameRunning) {
                gameRunning = true;
                dino.y = dino.groundY;
                dino.velocityY = 0;
                obstacles = [];
                score = 0;
                lives = 3;
                speedMultiplier = 1;
                invincible = false;

                clearInterval(speedIncreaseInterval);
                speedIncreaseInterval = setInterval(increaseSpeed, 5000);

                for (let i = 0; i < 3; i++) {
                    spawnObstacle();
                }

                updateGame();
            }
        }

        function increaseSpeed() {
            if (speedMultiplier < 1.2) {
                speedMultiplier += 0.02;
            } else {
                clearInterval(speedIncreaseInterval);
            }
        }

        function updateGame() {
            if (!gameRunning) {
                console.log("Game stopped.");
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            moveDino();
            moveObstacles();
            checkCollision();
            drawDino();
            drawObstacles();
            updateScore();
            drawScore();
            drawLives();

            requestAnimationFrame(updateGame);
        }

        function drawDino() {
            ctx.drawImage(dinoImg, dino.x, dino.y, dino.width, dino.height);
        }

        function moveDino() {
            dino.y += dino.velocityY;
            dino.velocityY += dino.gravity;

            if (dino.y > dino.groundY) { 
                dino.y = dino.groundY;
                dino.isJumping = false;
                dino.velocityY = 0;
            }
        }

        function drawObstacles() {
            obstacles.forEach(obstacle => {
                ctx.drawImage(obstacle.img, obstacle.x, obstacle.y, obstacle.width, obstacle.height);
            });
        }

        function moveObstacles() {
            for (let i = 0; i < obstacles.length; i++) {
                obstacles[i].x -= obstacles[i].speed * speedMultiplier;
            }

            if (obstacles.length > 0 && obstacles[0].x < -obstacles[0].width) {
                obstacles.shift();
                spawnObstacle();
            }
        }

        function checkCollision() {
            if (invincible) return;

            for (let obstacle of obstacles) {
                let dinoHitbox = { x: dino.x + 10, y: dino.y + 10, width: 40, height: 50 };
                let obstacleHitbox = { x: obstacle.x, y: obstacle.y, width: obstacle.width, height: obstacle.height };

                if (
                    dinoHitbox.x < obstacleHitbox.x + obstacleHitbox.width &&
                    dinoHitbox.x + dinoHitbox.width > obstacleHitbox.x &&
                    dinoHitbox.y < obstacleHitbox.y + obstacleHitbox.height &&
                    dinoHitbox.y + dinoHitbox.height > obstacleHitbox.y
                ) {
                    if (obstacle.src === 'mobil6.png') {
                        lives = Math.min(lives + 1, 3);  // Tambah nyawa 1 meskipun sudah penuh
                    } else {
                        lives--;  
                        invincible = true;  
                        setTimeout(() => { invincible = false; }, 1000);  
                    }

                    if (lives <= 0) {
                        gameRunning = false;
                        clearInterval(speedIncreaseInterval);
                        alert('Game Over! Skor Anda: ' + score);
                        return;
                    }
                }
            }
        }

        function updateScore() {
            score++;
        }

        function drawScore() {
            ctx.font = '20px Arial';
            ctx.fillStyle = 'black';
            ctx.fillText('Skor: ' + score, canvas.width - 120, 30);
        }

        function drawLives() {
            for (let i = 0; i < lives; i++) {
                ctx.drawImage(heartImg, 10 + i * 35, 10, 30, 30);
            }
        }
    </script>
</body>
</html>
