<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Game</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        #warning {
            display: none;
            color: red;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        canvas {
            background-color: #fff;
            border: 2px solid black;
        }
        .controls {
            margin-top: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="warning">⚠️ Putar layar ke mode landscape untuk pengalaman terbaik!</div>
    <canvas id="gameCanvas" width="700" height="250"></canvas>
    <div class="controls">
        <button id="startButton">Mulai</button>
        <button id="jumpButton">Lompat</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const warning = document.getElementById('warning');

        function checkOrientation() {
            if (window.innerWidth < 600) {
                warning.style.display = 'block';
            } else {
                warning.style.display = 'none';
            }
        }
        window.addEventListener('resize', checkOrientation);
        checkOrientation();

        const dinoImg = new Image();
        dinoImg.src = 'dino.png';

        const cactusImg = new Image();
        cactusImg.src = 'kaktus.png';

        const bgImg = new Image();
        bgImg.src = 'background.png';

        let gameRunning = false;
        let speedMultiplier = 1;
        let speedIncreaseInterval;

        let dino = {
            x: 50, 
            y: 175, 
            width: 60, 
            height: 60, 
            velocityY: 0, 
            gravity: 0.8, 
            jumpPower: -14, 
            isJumping: false 
        };

        let cacti = [];

        function spawnCactus() {
            let lastX = cacti.length > 0 ? cacti[cacti.length - 1].x : canvas.width;
            
            let sizeType = Math.random() < 0.5 ? "small" : "medium";
            let cactusHeight = sizeType === "small" ? 35 : 45; // Hanya kecil & sedang
            let newCactus = {
                x: lastX + Math.random() * 200 + 150, 
                y: 175 + (dino.height - cactusHeight), // Sejajar dalam satu garis horizontal
                width: sizeType === "small" ? 30 : 40,  
                height: cactusHeight, 
                hitboxX: 5, 
                hitboxY: 5, 
                hitboxWidth: sizeType === "small" ? 25 : 35, 
                hitboxHeight: cactusHeight - 5, 
                speed: 3 
            };
            cacti.push(newCactus);
        }

        document.getElementById('startButton').addEventListener('click', startGame);
        document.getElementById('jumpButton').addEventListener('click', jump);
        document.addEventListener('keydown', (event) => { if (event.code === 'Space') jump(); });

        function jump() {
            if (!gameRunning) return;
            if (!dino.isJumping) {
                dino.isJumping = true;
                dino.velocityY = dino.jumpPower;
            }
        }

        function startGame() {
            if (!gameRunning) {
                gameRunning = true;
                dino.y = 175;
                dino.velocityY = 0;
                cacti = [];
                speedMultiplier = 1;

                clearInterval(speedIncreaseInterval);
                speedIncreaseInterval = setInterval(increaseSpeed, 5000);

                for (let i = 0; i < 3; i++) {
                    spawnCactus();
                }

                updateGame();
            }
        }

        function increaseSpeed() {
            if (speedMultiplier < 1.2) {
                speedMultiplier += 0.02;
            } else {
                clearInterval(speedIncreaseInterval);
            }
        }

        function updateGame() {
            if (!gameRunning) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            moveDino();
            moveCactus();
            checkCollision();
            drawDino();
            drawCactus();
            requestAnimationFrame(updateGame);
        }

        function drawDino() {
            ctx.drawImage(dinoImg, dino.x, dino.y, dino.width, dino.height);
        }

        function moveDino() {
            dino.y += dino.velocityY;
            dino.velocityY += dino.gravity;

            if (dino.y > 175) { 
                dino.y = 175;
                dino.isJumping = false;
            }
        }

        function drawCactus() {
            cacti.forEach(cactus => {
                ctx.drawImage(cactusImg, cactus.x, cactus.y, cactus.width, cactus.height);
            });
        }

        function moveCactus() {
            for (let i = 0; i < cacti.length; i++) {
                cacti[i].x -= cacti[i].speed * speedMultiplier;
            }

            if (cacti.length > 0 && cacti[0].x < -cacti[0].width) {
                cacti.shift();
                spawnCactus();
            }
        }

        function checkCollision() {
            for (let cactus of cacti) {
                let dinoHitbox = {
                    x: dino.x + 10,
                    y: dino.y + 10,
                    width: 40,
                    height: 50
                };

                let cactusHitbox = {
                    x: cactus.x + cactus.hitboxX,
                    y: cactus.y + cactus.hitboxY,
                    width: cactus.hitboxWidth,
                    height: cactus.hitboxHeight
                };

                if (
                    dinoHitbox.x < cactusHitbox.x + cactusHitbox.width &&
                    dinoHitbox.x + dinoHitbox.width > cactusHitbox.x &&
                    dinoHitbox.y < cactusHitbox.y + cactusHitbox.height &&
                    dinoHitbox.y + dinoHitbox.height > cactusHitbox.y
                ) {
                    alert('Game Over!');
                    gameRunning = false;
                    clearInterval(speedIncreaseInterval);
                    return;
                }
            }
        }
    </script>
</body>
</html>
