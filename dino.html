<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Game</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        #warning {
            display: none;
            color: red;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        canvas {
            background-color: #fff;
            border: 2px solid black;
        }
        .controls {
            margin-top: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="warning">⚠️ Putar layar ke mode landscape untuk pengalaman terbaik!</div>
    <canvas id="gameCanvas" width="700" height="250"></canvas>
    <div class="controls">
        <button id="startButton">Mulai</button>
        <button id="jumpButton">Lompat</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const warning = document.getElementById('warning');

        function checkOrientation() {
            if (window.innerWidth < 600) {
                warning.style.display = 'block';
            } else {
                warning.style.display = 'none';
            }
        }
        window.addEventListener('resize', checkOrientation);
        checkOrientation();

        const dinoImg = new Image();
        dinoImg.src = 'dino.png';

        const carImg = new Image();
        carImg.src = 'mobil.png';

        const bgImg = new Image();
        bgImg.src = 'background.png';

        let gameRunning = false;
        let speedMultiplier = 1;
        let speedIncreaseInterval;

        let dino = {
            x: 50, 
            y: 150,  
            width: 60, 
            height: 60, 
            velocityY: 0, 
            gravity: 0.6,  
            jumpPower: -12,  
            isJumping: false,
            groundY: 150, 
            moveSpeed: 4,  // Kecepatan gerak maju/mundur
            moveDirection: 0  // -1 untuk mundur, 1 untuk maju, 0 untuk diam
        };

        let obstacles = [];

        function spawnObstacle() {
            let lastX = obstacles.length > 0 ? obstacles[obstacles.length - 1].x : canvas.width;
            
            let newObstacle = {
                x: lastX + Math.random() * 200 + 150, 
                y: dino.groundY + 30,  
                width: 50,  
                height: 30,  
                speed: 3  
            };
            obstacles.push(newObstacle);
        }

        document.getElementById('startButton').addEventListener('click', startGame);
        document.getElementById('jumpButton').addEventListener('click', jump);
        
        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space') jump();
            if (event.code === 'ArrowRight') dino.moveDirection = 1;
            if (event.code === 'ArrowLeft') dino.moveDirection = -1;
        });

        document.addEventListener('keyup', (event) => {
            if (event.code === 'ArrowRight' || event.code === 'ArrowLeft') dino.moveDirection = 0;
        });

        function jump() {
            if (!gameRunning) return;
            if (!dino.isJumping) {
                dino.isJumping = true;
                dino.velocityY = dino.jumpPower;
            }
        }

        function startGame() {
            if (!gameRunning) {
                gameRunning = true;
                dino.y = dino.groundY;
                dino.velocityY = 0;
                obstacles = [];
                speedMultiplier = 1;

                clearInterval(speedIncreaseInterval);
                speedIncreaseInterval = setInterval(increaseSpeed, 5000);

                for (let i = 0; i < 3; i++) {
                    spawnObstacle();
                }

                updateGame();
            }
        }

        function increaseSpeed() {
            if (speedMultiplier < 1.2) {
                speedMultiplier += 0.02;
            } else {
                clearInterval(speedIncreaseInterval);
            }
        }

        function updateGame() {
            if (!gameRunning) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            moveDino();
            moveObstacles();
            checkCollision();
            drawDino();
            drawObstacles();
            requestAnimationFrame(updateGame);
        }

        function drawDino() {
            ctx.drawImage(dinoImg, dino.x, dino.y, dino.width, dino.height);
        }

        function moveDino() {
            // Gerakan maju dan mundur
            dino.x += dino.moveDirection * dino.moveSpeed;

            // Batasi agar tidak keluar dari layar
            if (dino.x < 0) dino.x = 0;
            if (dino.x > canvas.width - dino.width) dino.x = canvas.width - dino.width;

            // Efek goyangan saat bergerak
            if (dino.moveDirection !== 0 && !dino.isJumping) {
                dino.y = dino.groundY + Math.sin(Date.now() / 100) * 2; 
            } else {
                dino.y = dino.groundY;
            }

            // Logika lompatan
            dino.y += dino.velocityY;
            dino.velocityY += dino.gravity;

            if (dino.y < dino.groundY - dino.maxJumpHeight) {
                dino.y = dino.groundY - dino.maxJumpHeight;
                dino.velocityY = 0;
            }

            if (dino.y > dino.groundY) {
                dino.y = dino.groundY;
                dino.isJumping = false;
            }
        }

        function drawObstacles() {
            obstacles.forEach(obstacle => {
                ctx.drawImage(carImg, obstacle.x, obstacle.y, obstacle.width, obstacle.height);
            });
        }

        function moveObstacles() {
            for (let i = 0; i < obstacles.length; i++) {
                obstacles[i].x -= obstacles[i].speed * speedMultiplier;
            }

            if (obstacles.length > 0 && obstacles[0].x < -obstacles[0].width) {
                obstacles.shift();
                spawnObstacle();
            }
        }

        function checkCollision() {
            for (let obstacle of obstacles) {
                if (
                    dino.x < obstacle.x + obstacle.width &&
                    dino.x + dino.width > obstacle.x &&
                    dino.y < obstacle.y + obstacle.height &&
                    dino.y + dino.height > obstacle.y
                ) {
                    alert('Game Over!');
                    gameRunning = false;
                    clearInterval(speedIncreaseInterval);
                    return;
                }
            }
        }
    </script>
</body>
</html>
