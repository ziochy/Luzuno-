<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Game</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        canvas {
            background-color: #fff;
            border: 2px solid black;
        }
        .controls {
            margin-top: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="200"></canvas>
    <div class="controls">
        <button id="startButton">Mulai</button>
        <button id="jumpButton">Loncat</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Load Images
        const dinoImg = new Image();
        dinoImg.src = 'dino.png';

        const cactusImg = new Image();
        cactusImg.src = 'kaktus.png';

        const bgImg = new Image();
        bgImg.src = 'background.png';

        let gameRunning = false;

        // Dino (Hitbox lebih kecil agar lebih adil)
        let dino = {
            x: 50, 
            y: 150, 
            width: 50, 
            height: 50, 
            hitboxX: 10, 
            hitboxY: 10, 
            hitboxWidth: 30, 
            hitboxHeight: 40, 
            velocityY: 0, 
            gravity: 0.8, 
            jumpPower: -12, 
            isJumping: false 
        };

        // Kumpulan Kaktus
        let cacti = [];

        function spawnCactus() {
            let lastX = cacti.length > 0 ? cacti[cacti.length - 1].x : canvas.width;

            let newCactus = {
                x: lastX + Math.random() * 200 + 150, // Jarak acak tapi aman
                y: 160, 
                width: 30, 
                height: 40, 
                hitboxX: 5, 
                hitboxY: 5, 
                hitboxWidth: 20, 
                hitboxHeight: 35, 
                speed: 3 
            };

            cacti.push(newCactus);
        }

        // Event Listener untuk tombol
        document.getElementById('startButton').addEventListener('click', startGame);
        document.getElementById('jumpButton').addEventListener('click', jump);
        document.addEventListener('keydown', (event) => { if (event.code === 'Space') jump(); });

        function jump() {
            if (!gameRunning) return;
            if (!dino.isJumping) {
                dino.isJumping = true;
                dino.velocityY = dino.jumpPower;
            }
        }

        function startGame() {
            if (!gameRunning) {
                gameRunning = true;
                dino.y = 150;
                dino.velocityY = 0;
                cacti = [];
                
                // Spawn beberapa kaktus awal
                for (let i = 0; i < 3; i++) {
                    spawnCactus();
                }

                updateGame();
            }
        }

        function updateGame() {
            if (!gameRunning) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height); // Gambar background
            moveDino();
            moveCactus();
            checkCollision();
            drawDino();
            drawCactus();
            requestAnimationFrame(updateGame);
        }

        function drawDino() {
            ctx.drawImage(dinoImg, dino.x, dino.y, dino.width, dino.height);
        }

        function moveDino() {
            dino.y += dino.velocityY;
            dino.velocityY += dino.gravity;

            if (dino.y > 150) { 
                dino.y = 150;
                dino.isJumping = false;
            }
        }

        function drawCactus() {
            cacti.forEach(cactus => {
                ctx.drawImage(cactusImg, cactus.x, cactus.y, cactus.width, cactus.height);
            });
        }

        function moveCactus() {
            for (let i = 0; i < cacti.length; i++) {
                cacti[i].x -= cacti[i].speed;
            }

            // Hapus kaktus yang keluar layar dan spawn yang baru
            if (cacti.length > 0 && cacti[0].x < -cacti[0].width) {
                cacti.shift();
                spawnCactus();
            }
        }

        function checkCollision() {
            for (let cactus of cacti) {
                let dinoHitbox = {
                    x: dino.x + dino.hitboxX,
                    y: dino.y + dino.hitboxY,
                    width: dino.hitboxWidth,
                    height: dino.hitboxHeight
                };

                let cactusHitbox = {
                    x: cactus.x + cactus.hitboxX,
                    y: cactus.y + cactus.hitboxY,
                    width: cactus.hitboxWidth,
                    height: cactus.hitboxHeight
                };

                if (
                    dinoHitbox.x < cactusHitbox.x + cactusHitbox.width &&
                    dinoHitbox.x + dinoHitbox.width > cactusHitbox.x &&
                    dinoHitbox.y < cactusHitbox.y + cactusHitbox.height &&
                    dinoHitbox.y + dinoHitbox.height > cactusHitbox.y
                ) {
                    alert('Game Over!');
                    gameRunning = false;
                    return;
                }
            }
        }
    </script>
</body>
</html>
